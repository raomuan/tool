<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站导航</title>
    <link rel="icon" type="image/png" href="https://img.icons8.com/ios/100/4A6BFF/compass--v1.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
    /* ==========================================
               主题变量
    ========================================== */
    :root,
    [data-theme="dark"] {
        --bg-body: linear-gradient(135deg, #0c0e1a 0%, #141630 40%, #1a1040 100%);
        --text-body: #e0e4f0;
        --orb-1: radial-gradient(circle, #4a6bff, #7c3aed);
        --orb-2: radial-gradient(circle, #06b6d4, #8b5cf6);
        --orb-opacity: 0.25;

        --surface-tabs: rgba(255,255,255,0.04);
        --border-tabs: rgba(255,255,255,0.06);
        --tab-color: rgba(255,255,255,0.55);
        --tab-hover-color: rgba(255,255,255,0.85);
        --tab-hover-bg: rgba(255,255,255,0.08);
        --tab-active-color: #fff;
        --tab-active-bg: rgba(74,107,255,0.25);
        --tab-active-shadow: 0 0 20px rgba(74,107,255,0.15);
        --tab-underline: linear-gradient(90deg, transparent, #60a5fa, transparent);

        --surface-section: rgba(255,255,255,0.03);
        --border-section: rgba(255,255,255,0.06);
        --title-color: rgba(255,255,255,0.85);
        --title-icon: #60a5fa;
        --title-line: rgba(96,165,250,0.3);

        --card-bg: rgba(255,255,255,0.05);
        --card-border: rgba(255,255,255,0.08);
        --card-color: #e0e4f0;
        --card-glow-from: rgba(96,165,250,0.5);
        --card-glow-mid: rgba(167,139,250,0.3);
        --card-glow-to: rgba(244,114,182,0.2);
        --card-spot: rgba(96,165,250,0.12);
        --card-hover-border: rgba(96,165,250,0.3);
        --card-shadow: 0 8px 40px rgba(74,107,255,0.15), 0 2px 10px rgba(0,0,0,0.2);
        --card-inset: rgba(255,255,255,0.06);

        --icon-bg: rgba(255,255,255,0.06);
        --icon-hover-shadow: rgba(96,165,250,0.2);
        --card-title-color: rgba(255,255,255,0.9);
        --card-title-hover: #60a5fa;
        --card-desc-color: rgba(255,255,255,0.4);
        --card-desc-hover: rgba(255,255,255,0.6);

        --surface-history: rgba(255,255,255,0.03);
        --border-history: rgba(255,255,255,0.06);
        --history-title: rgba(255,255,255,0.85);
        --history-empty: rgba(255,255,255,0.25);
        --history-item-color: rgba(255,255,255,0.65);
        --history-item-bg: rgba(255,255,255,0.05);
        --history-item-border: rgba(255,255,255,0.06);
        --history-item-hover-color: #fff;
        --history-item-hover-bg: rgba(74,107,255,0.2);
        --history-item-hover-border: rgba(96,165,250,0.3);
        --history-item-shadow: 0 4px 15px rgba(74,107,255,0.15);

        --scroll-thumb: rgba(255,255,255,0.15);
        --scroll-thumb-hover: rgba(255,255,255,0.25);
        --header-sub: rgba(255,255,255,0.5);

        --toggle-bg: rgba(255,255,255,0.08);
        --toggle-border: rgba(255,255,255,0.12);
        --toggle-hover-bg: rgba(255,255,255,0.15);
        --toggle-color: rgba(255,255,255,0.7);
        --toggle-hover-color: #fff;
    }

    /* ===== 亮色主题 ===== */
    [data-theme="light"] {
        --bg-body: linear-gradient(135deg, #eef2ff 0%, #f0f4ff 40%, #faf5ff 100%);
        --text-body: #334155;
        --orb-1: radial-gradient(circle, #818cf8, #c4b5fd);
        --orb-2: radial-gradient(circle, #67e8f9, #a78bfa);
        --orb-opacity: 0.15;

        --surface-tabs: rgba(255,255,255,0.7);
        --border-tabs: rgba(148,163,184,0.2);
        --tab-color: rgba(51,65,85,0.6);
        --tab-hover-color: rgba(51,65,85,0.9);
        --tab-hover-bg: rgba(99,102,241,0.08);
        --tab-active-color: #4f46e5;
        --tab-active-bg: rgba(99,102,241,0.12);
        --tab-active-shadow: 0 0 16px rgba(99,102,241,0.12);
        --tab-underline: linear-gradient(90deg, transparent, #818cf8, transparent);

        --surface-section: rgba(255,255,255,0.6);
        --border-section: rgba(148,163,184,0.15);
        --title-color: rgba(30,41,59,0.9);
        --title-icon: #6366f1;
        --title-line: rgba(99,102,241,0.2);

        --card-bg: rgba(255,255,255,0.75);
        --card-border: rgba(148,163,184,0.18);
        --card-color: #334155;
        --card-glow-from: rgba(99,102,241,0.35);
        --card-glow-mid: rgba(168,85,247,0.2);
        --card-glow-to: rgba(236,72,153,0.12);
        --card-spot: rgba(99,102,241,0.08);
        --card-hover-border: rgba(99,102,241,0.3);
        --card-shadow: 0 8px 32px rgba(99,102,241,0.10), 0 2px 8px rgba(0,0,0,0.06);
        --card-inset: rgba(255,255,255,0.5);

        --icon-bg: rgba(148,163,184,0.1);
        --icon-hover-shadow: rgba(99,102,241,0.15);
        --card-title-color: rgba(30,41,59,0.9);
        --card-title-hover: #6366f1;
        --card-desc-color: rgba(71,85,105,0.55);
        --card-desc-hover: rgba(71,85,105,0.75);

        --surface-history: rgba(255,255,255,0.6);
        --border-history: rgba(148,163,184,0.15);
        --history-title: rgba(30,41,59,0.9);
        --history-empty: rgba(71,85,105,0.35);
        --history-item-color: rgba(51,65,85,0.7);
        --history-item-bg: rgba(255,255,255,0.5);
        --history-item-border: rgba(148,163,184,0.18);
        --history-item-hover-color: #4f46e5;
        --history-item-hover-bg: rgba(99,102,241,0.1);
        --history-item-hover-border: rgba(99,102,241,0.25);
        --history-item-shadow: 0 4px 12px rgba(99,102,241,0.10);

        --scroll-thumb: rgba(71,85,105,0.2);
        --scroll-thumb-hover: rgba(71,85,105,0.35);
        --header-sub: rgba(71,85,105,0.5);

        --toggle-bg: rgba(99,102,241,0.1);
        --toggle-border: rgba(99,102,241,0.2);
        --toggle-hover-bg: rgba(99,102,241,0.2);
        --toggle-color: #6366f1;
        --toggle-hover-color: #4f46e5;
    }

    /* ==========================================
               基础重置 & 全局
    ========================================== */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
        min-height: 100vh;
        background: var(--bg-body);
        color: var(--text-body);
        padding: 30px 20px;
        line-height: 1.6;
        overflow-x: hidden;
        transition: background 0.5s ease, color 0.5s ease;
    }

    /* 背景动态装饰圆 */
    body::before,
    body::after {
        content: '';
        position: fixed;
        border-radius: 50%;
        filter: blur(120px);
        opacity: var(--orb-opacity);
        pointer-events: none;
        z-index: 0;
        animation: bgOrb 14s ease-in-out infinite alternate;
        transition: opacity 0.8s ease, background 0.8s ease;
    }
    body::before {
        width: 600px;
        height: 600px;
        background: var(--orb-1);
        top: -200px;
        right: -150px;
    }
    body::after {
        width: 500px;
        height: 500px;
        background: var(--orb-2);
        bottom: -200px;
        left: -150px;
        animation-delay: -7s;
    }

    @keyframes bgOrb {
        0%   { transform: translate(0, 0) scale(1); }
        50%  { transform: translate(60px, 40px) scale(1.1); }
        100% { transform: translate(-30px, -60px) scale(0.95); }
    }

    .container {
        max-width: 1200px;
        margin: 0 auto;
        position: relative;
        z-index: 1;
    }

    /* ==========================================
               头部
    ========================================== */
    .header {
        text-align: center;
        margin-bottom: 40px;
        padding: 20px 0;
        position: relative;
    }

    .header h1 {
        font-size: 36px;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa, #f472b6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: 1px;
    }

    .header p {
        color: var(--header-sub);
        font-size: 15px;
        margin-top: 8px;
        letter-spacing: 2px;
        transition: color 0.4s ease;
    }

    /* ===== 主题切换按钮 ===== */
    .theme-toggle {
        position: absolute;
        top: 50%;
        right: 0;
        transform: translateY(-50%);
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid var(--toggle-border);
        background: var(--toggle-bg);
        color: var(--toggle-color);
        font-size: 20px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.35s cubic-bezier(0.34,1.56,0.64,1);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
    }

    .theme-toggle:hover {
        background: var(--toggle-hover-bg);
        color: var(--toggle-hover-color);
        transform: translateY(-50%) scale(1.12) rotate(15deg);
        box-shadow: 0 0 20px rgba(99,102,241,0.2);
    }

    .theme-toggle:active {
        transform: translateY(-50%) scale(0.92);
    }

    /* ==========================================
               分类标签
    ========================================== */
    .tabs-container {
        margin-bottom: 35px;
        position: relative;
    }

    .tabs {
        display: flex;
        overflow-x: auto;
        gap: 10px;
        padding: 6px;
        background: var(--surface-tabs);
        border-radius: 16px;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--border-tabs);
        scrollbar-width: none;
        transition: background 0.4s ease, border-color 0.4s ease;
    }
    .tabs::-webkit-scrollbar { display: none; }

    .tab {
        padding: 12px 24px;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        font-size: 15px;
        font-weight: 500;
        background: transparent;
        color: var(--tab-color);
        transition: all 0.35s cubic-bezier(0.4,0,0.2,1);
        white-space: nowrap;
        flex-shrink: 0;
        position: relative;
        font-family: inherit;
    }

    .tab i {
        margin-right: 8px;
        font-size: 14px;
    }

    .tab:hover {
        color: var(--tab-hover-color);
        background: var(--tab-hover-bg);
        transform: translateY(-1px);
    }

    .tab.active {
        color: var(--tab-active-color);
        background: var(--tab-active-bg);
        box-shadow: var(--tab-active-shadow), inset 0 0 1px rgba(255,255,255,0.1);
    }

    .tab.active::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 60%;
        height: 2px;
        background: var(--tab-underline);
        border-radius: 2px;
    }

    /* ==========================================
               分类区块
    ========================================== */
    .section {
        border-radius: 20px;
        padding: 30px;
        margin-bottom: 35px;
        background: var(--surface-section);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid var(--border-section);
        transition: opacity 0.45s ease, transform 0.45s ease,
                    background 0.4s ease, border-color 0.4s ease;
    }

    .section.hidden {
        display: none;
    }

    .section-title {
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 22px;
        color: var(--title-color);
        display: flex;
        align-items: center;
        gap: 12px;
        transition: color 0.4s ease;
    }

    .section-title i {
        font-size: 20px;
        color: var(--title-icon);
        transition: color 0.4s ease;
    }

    .section-title::after {
        content: '';
        flex: 1;
        height: 1px;
        background: linear-gradient(90deg, var(--title-line), transparent);
        margin-left: 8px;
        transition: background 0.4s ease;
    }

    /* ==========================================
               卡片网格
    ========================================== */
    .cards-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 18px;
    }

    /* ==========================================
               卡片主体
    ========================================== */
    .card {
        position: relative;
        display: flex;
        flex-direction: column;
        padding: 22px 20px;
        min-height: 130px;
        border-radius: 16px;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        cursor: pointer;
        color: var(--card-color);
        text-decoration: none;
        transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1),
                    box-shadow 0.4s ease,
                    border-color 0.3s ease,
                    background 0.4s ease,
                    color 0.4s ease;
        transform-style: preserve-3d;
        perspective: 800px;
        /* 进场动画 */
        opacity: 0;
        transform: translateY(30px);
        animation: cardEnter 0.5s ease-out forwards;
    }

    .card:nth-child(1)  { animation-delay: 0.05s; }
    .card:nth-child(2)  { animation-delay: 0.10s; }
    .card:nth-child(3)  { animation-delay: 0.15s; }
    .card:nth-child(4)  { animation-delay: 0.20s; }
    .card:nth-child(5)  { animation-delay: 0.25s; }
    .card:nth-child(6)  { animation-delay: 0.30s; }
    .card:nth-child(7)  { animation-delay: 0.35s; }
    .card:nth-child(8)  { animation-delay: 0.40s; }
    .card:nth-child(9)  { animation-delay: 0.45s; }
    .card:nth-child(10) { animation-delay: 0.50s; }
    .card:nth-child(11) { animation-delay: 0.55s; }
    .card:nth-child(12) { animation-delay: 0.60s; }

    @keyframes cardEnter {
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* 卡片发光边框 */
    .card::before {
        content: '';
        position: absolute;
        inset: -1px;
        border-radius: 17px;
        background: linear-gradient(135deg,
            rgba(96,165,250,0),
            rgba(167,139,250,0),
            rgba(244,114,182,0));
        z-index: -1;
        opacity: 0;
        transition: opacity 0.5s ease;
        pointer-events: none;
    }

    .card:hover::before {
        opacity: 1;
        background: linear-gradient(135deg,
            var(--card-glow-from),
            var(--card-glow-mid),
            var(--card-glow-to));
    }

    /* 卡片悬停光晕 */
    .card::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 100%;
        height: 100%;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%),
                    var(--card-spot) 0%,
                    transparent 60%);
        opacity: 0;
        transition: opacity 0.4s ease;
        pointer-events: none;
        border-radius: inherit;
    }

    .card:hover::after {
        opacity: 1;
    }

    .card:hover {
        border-color: var(--card-hover-border);
        box-shadow: var(--card-shadow), inset 0 1px 0 var(--card-inset);
        transform: translateY(-4px) scale(1.02);
    }

    .card:active {
        transform: scale(0.97) !important;
        transition-duration: 0.1s;
    }

    /* 卡片内容 */
    .card-header {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 14px;
        transform: translateZ(30px);
        transition: transform 0.3s ease;
    }

    .card-icon {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        object-fit: contain;
        background: var(--icon-bg);
        padding: 4px;
        transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1),
                    box-shadow 0.3s ease,
                    background 0.4s ease;
    }

    .card:hover .card-icon {
        transform: scale(1.15) rotate(-4deg);
        box-shadow: 0 0 20px var(--icon-hover-shadow);
    }

    .card-title {
        font-weight: 600;
        font-size: 16px;
        color: var(--card-title-color);
        transition: color 0.3s ease;
    }

    .card:hover .card-title {
        color: var(--card-title-hover);
    }

    .card-desc {
        font-size: 13px;
        color: var(--card-desc-color);
        margin-top: auto;
        line-height: 1.5;
        transform: translateZ(20px);
        transition: color 0.3s ease;
    }

    .card:hover .card-desc {
        color: var(--card-desc-hover);
    }

    /* ==========================================
               历史记录
    ========================================== */
    .history-section {
        border-radius: 20px;
        padding: 28px 30px;
        margin-top: 15px;
        background: var(--surface-history);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid var(--border-history);
        transition: background 0.4s ease, border-color 0.4s ease;
    }

    .history-title {
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 18px;
        color: var(--history-title);
        display: flex;
        align-items: center;
        gap: 12px;
        transition: color 0.4s ease;
    }

    .history-title i {
        color: var(--title-icon);
        transition: color 0.4s ease;
    }

    .history-items {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        min-height: 46px;
    }

    .history-empty {
        color: var(--history-empty);
        font-size: 14px;
        padding: 8px 0;
        transition: color 0.4s ease;
    }

    .history-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 20px;
        border-radius: 30px;
        font-size: 14px;
        cursor: pointer;
        color: var(--history-item-color);
        text-decoration: none;
        background: var(--history-item-bg);
        border: 1px solid var(--history-item-border);
        transition: all 0.3s cubic-bezier(0.4,0,0.2,1),
                    background 0.4s ease, border-color 0.4s ease, color 0.4s ease;
    }

    .history-item img {
        width: 16px;
        height: 16px;
        border-radius: 4px;
        flex-shrink: 0;
    }

    .history-item:hover {
        color: var(--history-item-hover-color);
        background: var(--history-item-hover-bg);
        border-color: var(--history-item-hover-border);
        transform: translateY(-2px);
        box-shadow: var(--history-item-shadow);
    }

    /* ==========================================
               滚动条
    ========================================== */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
        background: var(--scroll-thumb);
        border-radius: 10px;
        transition: background 0.4s ease;
    }
    ::-webkit-scrollbar-thumb:hover {
        background: var(--scroll-thumb-hover);
    }

    /* ==========================================
               响应式
    ========================================== */
    @media (max-width: 992px) {
        .cards-container {
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        }
        .header h1 { font-size: 30px; }
    }

    @media (max-width: 768px) {
        body { padding: 20px 16px; }
        .section { padding: 22px 18px; }
        .card { padding: 18px 16px; min-height: 110px; }
        .tab { padding: 10px 18px; font-size: 14px; }
        .header h1 { font-size: 26px; }
        .header { margin-bottom: 30px; }
        .history-section { padding: 22px 18px; }
        .tabs { padding: 4px; border-radius: 12px; }
        .tab { border-radius: 10px; }
        .theme-toggle { width: 38px; height: 38px; font-size: 17px; }
    }

    @media (max-width: 576px) {
        .cards-container {
            grid-template-columns: 1fr;
            gap: 14px;
        }
        .section { padding: 18px 14px; border-radius: 16px; }
        .card { padding: 16px 14px; min-height: 100px; }
        .tab { padding: 8px 14px; font-size: 13px; }
        .header h1 { font-size: 22px; }
        .header p { font-size: 13px; }
        .history-item { padding: 8px 14px; font-size: 13px; }
        body { padding: 16px 12px; }
        .theme-toggle { width: 34px; height: 34px; font-size: 15px; top: 16px; right: 0; transform: none; }
        .theme-toggle:hover { transform: scale(1.12) rotate(15deg); }
        .header { padding-top: 50px; }
    }
</style>
</head>
<body>
<div class="container">

    <!-- 头部 -->
    <div class="header">
        <h1>✦ 导航站</h1>
        <p>收集有用的一切</p>
        <button class="theme-toggle" id="themeToggle" title="切换主题">
            <i class="fas fa-moon"></i>
        </button>
    </div>

    <!-- 分类标签 -->
    <div class="tabs-container">
        <div class="tabs" id="category-tabs"></div>
    </div>

    <!-- 分类卡片 -->
    <div id="sections-container"></div>

    <!-- 历史记录 -->
    <div class="history-section">
        <h2 class="history-title"><i class="fas fa-history"></i> 最近访问</h2>
        <div class="history-items" id="history-items">
            <span class="history-empty">暂无记录</span>
        </div>
    </div>

</div>

<script>
// ===== 数据配置 =====
const config = {
    categories: [
        {
            title: "常用",
            icon: "fa-bookmark",

// ===== 主题切换 =====

function initTheme() {
    const saved = localStorage.getItem('navTheme');
    if (saved === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
    } else {
        document.documentElement.setAttribute('data-theme', 'dark');
    }
    updateThemeIcon();
}

function toggleTheme() {
    const html = document.documentElement;
    const current = html.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('navTheme', next);
    updateThemeIcon();
}

function updateThemeIcon() {
    const btn = document.getElementById('themeToggle');
    const theme = document.documentElement.getAttribute('data-theme');
    btn.innerHTML = theme === 'dark'
        ? '<i class="fas fa-sun"></i>'
        : '<i class="fas fa-moon"></i>';
}

// ===== 渲染 =====

function createTabs() {
    const container = document.getElementById('category-tabs');
    config.categories.forEach((cat, i) => {
        const btn = document.createElement('button');
        btn.className = `tab${i === 0 ? ' active' : ''}`;
        btn.innerHTML = `<i class="fas ${cat.icon}"></i> ${cat.title}`;
        btn.dataset.tab = cat.tab;
        container.appendChild(btn);
    });
}

function createSections() {
    const container = document.getElementById('sections-container');
    config.categories.forEach((cat, i) => {
        const section = document.createElement('div');
        section.className = `section${i === 0 ? '' : ' hidden'}`;
        section.id = cat.tab;

        const title = document.createElement('h2');
        title.className = 'section-title';
        title.innerHTML = `<i class="fas ${cat.icon}"></i> ${cat.title}网站`;

        const grid = document.createElement('div');
        grid.className = 'cards-container';

        cat.cards.forEach(c => {
            const a = document.createElement('a');
            a.className = 'card';
            a.href = c.url;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            a.innerHTML = `
                <div class="card-header">
                    <img src="${c.icon}" class="card-icon" alt="" loading="lazy"
                         onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 40%22><rect fill=%22%23333%22 width=%2240%22 height=%2240%22 rx=%228%22/></svg>'">
                    <div class="card-title">${c.title}</div>
                </div>
                <div class="card-desc">${c.desc}</div>
            `;
            grid.appendChild(a);
        });

        section.appendChild(title);
        section.appendChild(grid);
        container.appendChild(section);
    });
}

// ===== 标签切换 =====

function initTabs() {
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            document.querySelectorAll('.section').forEach(s => s.classList.add('hidden'));
            document.getElementById(tab.dataset.tab).classList.remove('hidden');
        });
    });
}

// ===== 卡片 3D Tilt =====

function initTilt() {
    document.querySelectorAll('.card').forEach(card => {
        card.addEventListener('mousemove', e => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const rotateX = ((y - centerY) / centerY) * -8;
            const rotateY = ((x - centerX) / centerX) * 8;
            const pctX = (x / rect.width) * 100;
            const pctY = (y / rect.height) * 100;
            card.style.setProperty('--mx', pctX + '%');
            card.style.setProperty('--my', pctY + '%');
            card.style.transform =
                `perspective(800px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-6px) scale(1.02)`;
        });
        card.addEventListener('mouseleave', () => {
            card.style.transform = '';
            card.style.setProperty('--mx', '50%');
            card.style.setProperty('--my', '50%');
        });
    });
}

// ===== 点击记录历史 =====

function initCards() {
    document.querySelectorAll('.card').forEach(card => {
        card.addEventListener('click', function () {
            const icon = this.querySelector('.card-icon').src;
            const title = this.querySelector('.card-title').textContent;
            addToHistory(this.href, title, icon);
            this.style.transform = 'scale(0.95)';
            setTimeout(() => this.style.transform = '', 200);
        });
    });
}

// ===== 历史记录 =====

let history = JSON.parse(localStorage.getItem('navHistory')) || [];

function addToHistory(url, title, icon) {
    const idx = history.findIndex(item => item.url === url);
    if (idx >= 0) {
        const [item] = history.splice(idx, 1);
        history.unshift(item);
    } else {
        history.unshift({ url, title, icon });
    }
    if (history.length > 5) history = history.slice(0, 5);
    localStorage.setItem('navHistory', JSON.stringify(history));
    updateHistoryDisplay();
}

function updateHistoryDisplay() {
    const container = document.getElementById('history-items');
    container.innerHTML = '';
    if (history.length === 0) {
        container.innerHTML = '<span class="history-empty">暂无记录</span>';
        return;
    }
    history.forEach(item => {
        const a = document.createElement('a');
        a.className = 'history-item';
        a.href = item.url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.innerHTML = `<img src="${item.icon}" alt=""> ${item.title}`;
        container.appendChild(a);
    });
}

// ===== 启动 =====

initTheme();
document.getElementById('themeToggle').addEventListener('click', toggleTheme);
createTabs();
createSections();
initTabs();
updateHistoryDisplay();
initCards();
initTilt();
</script>
